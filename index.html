<!doctype html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/Vanta-the-guy/balatro@main/">

  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
  <title>Balatro</title>



  
  <link rel="stylesheet" type="text/css" href="theme/love.css">

  <script src="consolewrapper.js"></script>

  <style>
   
    #loadingContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      z-index: 999;
    }
    #loadingText {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: Arial, sans-serif;
      font-size: 2em;
      
      color: #ffffff;
      text-shadow: 0px 2px 5px rgba(0,0,0,0.8);
      text-align: center;
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="loadingContainer">
    <div id="loadingText">Downloading...</div>
  </div>

  <center>
    <div>
      <canvas id="canvas" oncontextmenu="event.preventDefault()" width="100%" height="100%" style="visibility: hidden; position: absolute; top: 0; left: 0; z-index: 1;"></canvas>
    </div>
  </center>

  <script type='text/javascript'>
    window.isGameLoaded = false; 

    window.callad = () => {
      window.parent.postMessage({
        type: 'adcall'
      }, '*');
    }

    function goFullScreen() {
      var canvas = document.getElementById("canvas");
      if (canvas.requestFullScreen)
        canvas.requestFullScreen();
      else if (canvas.webkitRequestFullScreen)
        canvas.webkitRequestFullScreen();
      else if (canvas.mozRequestFullScreen)
        canvas.mozRequestFullScreen();
    }

    function FullScreenHook() {
      var canvas = document.getElementById("canvas");
      canvas.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      canvas.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
    }

    function drawLoadingText(text) {
      var textElement = document.getElementById('loadingText');
      if (textElement) {
        textElement.innerText = text;
      }
    }

    window.onload = function() {
      window.focus();
    };
    window.onclick = function() {
      window.focus();
    };

    window.addEventListener("keydown", function(e) {
    
      if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
        e.preventDefault();
      }
    }, false);

    var Module = {
      arguments: ["./game.love"],
      INITIAL_MEMORY: 256000000,
      printErr: console.error.bind(console),
      canvas: (function() {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener("webglcontextlost", function(e) {
          alert('WebGL context lost. You will need to reload the page.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function(text) {
        if (text) {
          drawLoadingText(text);
        } else if (Module.remainingDependencies === 0) {
          
          document.getElementById('loadingContainer').style.display = 'none';
          document.getElementById('canvas').style.visibility = 'visible';
          window.isGameLoaded = true; 
        }
      },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function(left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading...');
    
    window.onerror = function(event) {
      Module.setStatus('Exception thrown, see JavaScript console');
      Module.setStatus = function(text) {
        if (text) Module.printErr('[post-exception status] ' + text);
      };
    };

    var applicationLoad = function(e) {
      Love(Module);
    }
  </script>
  
  <script type="text/javascript" src="game.js?v=d7e34743-2fea-4de6-8a0e-1103b5fcf07f"></script>
  <script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>

  
  <script type="module">
    import { Renderer, Program, Mesh, Triangle } from 'https://esm.sh/ogl@1.0.11';

    const CONFIG = {
      spinRotation:    -2.0,
      spinSpeed:        7.0,
      offset:          [0.0, 0.0],
      color1:          '#838282',
      color2:          '#000000',
      color3:          '#000000',
      contrast:         3.5,
      lighting:         0.4,
      spinAmount:       0.25,
      pixelFilter:    745.0,
      spinEase:         1.0,
      isRotate:         false,
      mouseInteraction: false,
    };

    function hexToVec4(hex) {
      const h = hex.replace('#', '');
      let r = 0, g = 0, b = 0, a = 1;
      if (h.length === 6) {
        r = parseInt(h.slice(0, 2), 16) / 255;
        g = parseInt(h.slice(2, 4), 16) / 255;
        b = parseInt(h.slice(4, 6), 16) / 255;
      } else if (h.length === 8) {
        r = parseInt(h.slice(0, 2), 16) / 255;
        g = parseInt(h.slice(2, 4), 16) / 255;
        b = parseInt(h.slice(4, 6), 16) / 255;
        a = parseInt(h.slice(6, 8), 16) / 255;
      }
      return [r, g, b, a];
    }

    const vertexShader = `
    attribute vec2 uv;
    attribute vec2 position;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 0, 1);
    }`;

    const fragmentShader = `
    precision highp float;
    #define PI 3.14159265359

    uniform float iTime;
    uniform vec3 iResolution;
    uniform float uSpinRotation;
    uniform float uSpinSpeed;
    uniform vec2 uOffset;
    uniform vec4 uColor1;
    uniform vec4 uColor2;
    uniform vec4 uColor3;
    uniform float uContrast;
    uniform float uLighting;
    uniform float uSpinAmount;
    uniform float uPixelFilter;
    uniform float uSpinEase;
    uniform bool uIsRotate;
    uniform vec2 uMouse;

    varying vec2 vUv;

    vec4 effect(vec2 screenSize, vec2 screen_coords) {
        float pixel_size = length(screenSize.xy) / uPixelFilter;
        vec2 uv = (floor(screen_coords.xy * (1.0 / pixel_size)) * pixel_size - 0.5 * screenSize.xy) / length(screenSize.xy) - uOffset;
        float uv_len = length(uv);

        float speed = (uSpinRotation * uSpinEase * 0.2);
        if (uIsRotate) { speed = iTime * speed; }
        speed += 302.2;

        float mouseInfluence = (uMouse.x * 2.0 - 1.0);
        speed += mouseInfluence * 0.1;

        float new_pixel_angle = atan(uv.y, uv.x) + speed - uSpinEase * 20.0 * (uSpinAmount * uv_len + (1.0 - uSpinAmount));
        vec2 mid = (screenSize.xy / length(screenSize.xy)) / 2.0;
        uv = (vec2(uv_len * cos(new_pixel_angle) + mid.x, uv_len * sin(new_pixel_angle) + mid.y) - mid);

        uv *= 30.0;
        float baseSpeed = iTime * uSpinSpeed;
        speed = baseSpeed + mouseInfluence * 2.0;

        vec2 uv2 = vec2(uv.x + uv.y);
        for (int i = 0; i < 5; i++) {
            uv2 += sin(max(uv.x, uv.y)) + uv;
            uv += 0.5 * vec2(
                cos(5.1123314 + 0.353 * uv2.y + speed * 0.131121),
                sin(uv2.x - 0.113 * speed)
            );
            uv -= cos(uv.x + uv.y) - sin(uv.x * 0.711 - uv.y);
        }

        float contrast_mod = (0.25 * uContrast + 0.5 * uSpinAmount + 1.2);
        float paint_res = min(2.0, max(0.0, length(uv) * 0.035 * contrast_mod));
        float c1p = max(0.0, 1.0 - contrast_mod * abs(1.0 - paint_res));
        float c2p = max(0.0, 1.0 - contrast_mod * abs(paint_res));
        float c3p = 1.0 - min(1.0, c1p + c2p);
        float light = (uLighting - 0.2) * max(c1p * 5.0 - 4.0, 0.0) + uLighting * max(c2p * 5.0 - 4.0, 0.0);

        return (0.3 / uContrast) * uColor1
             + (1.0 - 0.3 / uContrast) * (uColor1 * c1p + uColor2 * c2p + vec4(c3p * uColor3.rgb, c3p * uColor1.a))
             + light;
    }

    void main() {
        vec2 uv = vUv * iResolution.xy;
        gl_FragColor = effect(iResolution.xy, uv);
    }`;

    
    const container = document.getElementById('loadingContainer');
    const renderer = new Renderer();
    const gl = renderer.gl;
    gl.clearColor(0, 0, 0, 1);

    let program;

    function resize() {
      renderer.setSize(container.offsetWidth, container.offsetHeight);
      if (program) {
        program.uniforms.iResolution.value = [
          gl.canvas.width,
          gl.canvas.height,
          gl.canvas.width / gl.canvas.height,
        ];
      }
    }
    window.addEventListener('resize', resize);
    resize();

    const geometry = new Triangle(gl);
    program = new Program(gl, {
      vertex: vertexShader,
      fragment: fragmentShader,
      uniforms: {
        iTime:         { value: 0 },
        iResolution:   { value: [gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height] },
        uSpinRotation: { value: CONFIG.spinRotation },
        uSpinSpeed:    { value: CONFIG.spinSpeed },
        uOffset:       { value: CONFIG.offset },
        uColor1:       { value: hexToVec4(CONFIG.color1) },
        uColor2:       { value: hexToVec4(CONFIG.color2) },
        uColor3:       { value: hexToVec4(CONFIG.color3) },
        uContrast:     { value: CONFIG.contrast },
        uLighting:     { value: CONFIG.lighting },
        uSpinAmount:   { value: CONFIG.spinAmount },
        uPixelFilter:  { value: CONFIG.pixelFilter },
        uSpinEase:     { value: CONFIG.spinEase },
        uIsRotate:     { value: CONFIG.isRotate },
        uMouse:        { value: [0.5, 0.5] },
      },
    });

    const mesh = new Mesh(gl, { geometry, program });
    container.appendChild(gl.canvas);

    container.addEventListener('mousemove', (e) => {
      if (!CONFIG.mouseInteraction) return;
      const rect = container.getBoundingClientRect();
      program.uniforms.uMouse.value = [
        (e.clientX - rect.left) / rect.width,
        1.0 - (e.clientY - rect.top) / rect.height,
      ];
    });

    function update(time) {
      
      if (window.isGameLoaded) return;
      
      requestAnimationFrame(update);
      program.uniforms.iTime.value = time * 0.001;
      renderer.render({ scene: mesh });
    }
    requestAnimationFrame(update);
  </script>
</body>
</html>
